<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - WA Promo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --primary: #00d26a;
            --text-main: #fff;
            --bg-panel: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body {
            background: var(--bg-main);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }

        .container {
            position: relative; width: 850px; height: 550px;
            background: var(--bg-panel); border-radius: 20px;
            box-shadow: 0 14px 28px rgba(0,0,0,0.25), 0 10px 10px rgba(0,0,0,0.22);
            overflow: hidden;
            max-width: 100%;
        }

        .form-container {
            position: absolute; top: 0; height: 100%; transition: all 0.6s ease-in-out;
            display: flex; align-items: center; justify-content: center; flex-direction: column;
            padding: 0 50px; text-align: center; color: var(--text-main); width: 50%;
        }

        .sign-in-container { left: 0; z-index: 2; }
        .sign-up-container { left: 0; opacity: 0; z-index: 1; }

        .container.right-panel-active .sign-in-container { transform: translateX(100%); opacity: 0; }
        .container.right-panel-active .sign-up-container { transform: translateX(100%); opacity: 1; z-index: 5; animation: show 0.6s; }

        @keyframes show { 0%, 49.99% { opacity: 0; z-index: 1; } 50%, 100% { opacity: 1; z-index: 5; } }

        h1 { font-weight: bold; margin: 0 0 20px; }
        span { font-size: 12px; margin-bottom: 15px; color: #aaa; }
        
        input {
            background-color: #0f172a; border: 1px solid #334155;
            padding: 12px 15px; margin: 8px 0; width: 100%;
            border-radius: 8px; color: #fff; outline: none;
        }
        input:focus { border-color: var(--primary); }

        button {
            border-radius: 20px; border: 1px solid var(--primary);
            background-color: var(--primary); color: #000;
            font-size: 12px; font-weight: bold; padding: 12px 45px;
            letter-spacing: 1px; text-transform: uppercase; margin-top: 20px;
            cursor: pointer; transition: transform 80ms ease-in;
        }
        button:active { transform: scale(0.95); }
        button:focus { outline: none; }
        button.ghost { background-color: transparent; border-color: #FFFFFF; color: #FFFFFF; }

        /* Overlay */
        .overlay-container {
            position: absolute; top: 0; left: 50%; width: 50%; height: 100%;
            overflow: hidden; transition: transform 0.6s ease-in-out; z-index: 100;
        }
        .container.right-panel-active .overlay-container { transform: translateX(-100%); }

        .overlay {
            background: linear-gradient(to right, #00d26a, #00a855);
            background-repeat: no-repeat; background-size: cover; background-position: 0 0;
            color: #FFFFFF; position: relative; left: -100%; height: 100%; width: 200%;
            transform: translateX(0); transition: transform 0.6s ease-in-out;
        }
        .container.right-panel-active .overlay { transform: translateX(50%); }

        .overlay-panel {
            position: absolute; display: flex; align-items: center; justify-content: center;
            flex-direction: column; padding: 0 40px; text-align: center; top: 0; height: 100%; width: 50%; transform: translateX(0); transition: transform 0.6s ease-in-out;
        }

        .overlay-left { transform: translateX(-20%); }
        .container.right-panel-active .overlay-left { transform: translateX(0); }
        .overlay-right { right: 0; transform: translateX(0); }
        .container.right-panel-active .overlay-right { transform: translateX(20%); }

        /* Social */
        .social-container { margin: 20px 0; }
        .social-container a {
            border: 1px solid #DDDDDD; border-radius: 50%; display: inline-flex;
            justify-content: center; align-items: center; margin: 0 5px; height: 40px; width: 40px;
            color: white; text-decoration: none; transition: 0.3s;
        }
        .social-container a:hover { background: white; color: black; }
        
        .mobile-toggle { display: none; margin-top: 20px; color: var(--primary); cursor: pointer; text-decoration: underline; }

        /* Mobile */
        @media (max-width: 768px) {
            .container { width: 100%; height: 100vh; border-radius: 0; box-shadow: none; }
            .overlay-container { display: none; } /* Hide animation on mobile */
            .form-container { width: 100%; position: relative; height: auto; top: 20%; }
            .sign-in-container { z-index: 5; }
            .sign-up-container { display: none; }
            
            /* Class to swap on mobile */
            body.mobile-active .sign-in-container { display: none; }
            body.mobile-active .sign-up-container { display: flex; opacity: 1; z-index: 5; }
            
            .mobile-toggle { display: block; }
        }
    </style>
</head>
<body>

<div class="container" id="container">
    
    <!-- Sign Up Form -->
    <div class="form-container sign-up-container">
        <form id="signupForm">
            <h1>إنشاء حساب</h1>
            <div class="social-container">
                <a href="/api/auth/google" class="social"><i class="fab fa-google"></i></a>
            </div>
            <span>أو استخدم بريدك الإلكتروني</span>
            <input type="text" id="regName" placeholder="الاسم الكامل" required />
            <input type="email" id="regEmail" placeholder="البريد الإلكتروني" required />
            <input type="password" id="regPassword" placeholder="كلمة المرور" required />
            <button type="submit">تسجيل</button>
            <p id="regError" style="color: #ff4444; font-size: 0.8rem; margin-top: 10px;"></p>
            <span class="mobile-toggle" onclick="toggleMobile()">لديك حساب؟ تسجيل الدخول</span>
        </form>
    </div>

    <!-- Sign In Form -->
    <div class="form-container sign-in-container">
        <form id="loginForm">
            <h1>تسجيل الدخول</h1>
            <div class="social-container">
                <a href="/api/auth/google" class="social"><i class="fab fa-google"></i></a>
            </div>
            <span>أو استخدم حسابك</span>
            <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" required />
            <input type="password" id="loginPassword" placeholder="كلمة المرور" required />
            <a href="#" style="color: #ccc; font-size: 0.8rem; margin: 10px 0; text-decoration: none;">نسيت كلمة المرور؟</a>
            <button type="submit">دخول</button>
            <p id="loginError" style="color: #ff4444; font-size: 0.8rem; margin-top: 10px;"></p>
            <span class="mobile-toggle" onclick="toggleMobile()">ليس لديك حساب؟ إنشاء حساب</span>
        </form>
    </div>

    <!-- Overlay Panel (Animation) -->
    <div class="overlay-container">
        <div class="overlay">
            <div class="overlay-panel overlay-left">
                <h1>مرحباً بعودتك!</h1>
                <p>للبقاء على اتصال معنا، يرجى تسجيل الدخول</p>
                <button class="ghost" id="signIn">تسجيل الدخول</button>
            </div>
            <div class="overlay-panel overlay-right">
                <h1>مرحباً يا صديق!</h1>
                <p>أدخل تفاصيلك الشخصية وابدأ رحلتك معنا</p>
                <button class="ghost" id="signUp">إنشاء حساب</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Animation Logic (Desktop)
    const signUpButton = document.getElementById('signUp');
    const signInButton = document.getElementById('signIn');
    const container = document.getElementById('container');

    signUpButton.addEventListener('click', () => { container.classList.add("right-panel-active"); });
    signInButton.addEventListener('click', () => { container.classList.remove("right-panel-active"); });

    // Mobile Logic
    function toggleMobile() {
        document.body.classList.toggle('mobile-active');
    }

    // --- API Logic ---
    
    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const btn = e.target.querySelector('button');
        const err = document.getElementById('loginError');
        
        btn.textContent = 'جاري التحقق...'; btn.disabled = true; err.textContent = '';

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            
            if (res.ok) {
                localStorage.setItem('authToken', data.token);
                
                // === FIX: التوجيه الصحيح للأدمن ===
                // إذا كان أدمن (abdo140693@gmail.com) -> يذهب لـ /admin
                // إذا كان مستخدم عادي -> يذهب لـ /dashboard
                if (data.isAdmin) {
                    window.location.href = '/admin'; // Server Route that serves admin-blog.html
                } else {
                    window.location.href = '/dashboard';
                }
            } else {
                err.textContent = data.message || 'خطأ في الدخول';
                btn.disabled = false; btn.textContent = 'دخول';
            }
        } catch (error) {
            err.textContent = 'خطأ في الاتصال بالخادم';
            btn.disabled = false; btn.textContent = 'دخول';
        }
    });

    // Sign Up
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('regName').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;
        const btn = e.target.querySelector('button');
        const err = document.getElementById('regError');

        btn.textContent = 'جاري التسجيل...'; btn.disabled = true; err.textContent = '';

        try {
            const res = await fetch('/api/auth/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });
            const data = await res.json();
            
            if (res.ok) {
                alert('تم التسجيل بنجاح! يمكنك تسجيل الدخول الآن.');
                container.classList.remove("right-panel-active");
                if(window.innerWidth <= 768) toggleMobile();
            } else {
                err.textContent = data.message || 'خطأ في التسجيل';
            }
        } catch (error) { err.textContent = 'خطأ في الاتصال'; } 
        finally { btn.disabled = false; btn.textContent = 'تسجيل'; }
    });
</script>

</body>
</html>
