<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- Google Tag Manager -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z3N357ZJ1W"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-Z3N357ZJ1W');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Pro - Blog</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* --- Dark Theme Variables --- */
        :root {
            --bg-main: #0f172a;         
            --bg-card: #1e293b;         
            --primary: #00d26a;         
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        /* --- General Styles --- */
        body { 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            font-family: 'Cairo', sans-serif; 
            margin: 0; 
            overflow-x: hidden;
        }

        /* LTR Font Support */
        html[lang="en"] body { font-family: 'Inter', sans-serif; }
        
        a { text-decoration: none; color: inherit; transition: 0.3s; }

        /* --- Navbar --- */
        .header-nav {
            padding: 15px 5%; background: rgba(15, 23, 42, 0.95);
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000;
        }
        
        .lang-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: #94a3b8; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        .lang-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .nav-link { font-weight: bold; display: flex; align-items: center; gap: 8px; color: #ccc; }
        .nav-link:hover { color: var(--primary); }

        /* --- Article Container --- */
        .container { max-width: 800px; margin: 40px auto; padding: 20px; }
        
        .post-img { 
            width: 100%; height: 400px; object-fit: cover; 
            border-radius: 12px; margin-bottom: 30px; 
            display: none; border: 1px solid var(--border-color); 
        }
        
        h1 { color: var(--primary); font-size: 2.5em; margin-bottom: 15px; line-height: 1.3; }
        
        .meta { color: #888; font-size: 0.9em; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 20px; }
        
        /* Content Styling */
        .content { line-height: 1.8; font-size: 1.15em; color: #e2e8f0; }
        .content p { margin-bottom: 20px; }
        .content strong { color: white; }
        
        html[dir="ltr"] .content { text-align: left; }
        
        /* Elements inside content */
        .content h2, .content h3 { color: white; margin-top: 30px; margin-bottom: 15px; }
        .content ul { margin-bottom: 20px; padding-right: 20px; }
        html[dir="ltr"] .content ul { padding-right: 0; padding-left: 20px; }
        
        /* AdSpace */
        .ad-space { 
            background: #000; border: 1px dashed #444; height: 120px; 
            display: flex; align-items: center; justify-content: center; 
            color: #666; margin: 30px 0; border-radius: 8px; font-family: monospace;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-nav { padding: 15px 20px; }
            h1 { font-size: 1.8em; }
            .post-img { height: 250px; }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="header-nav">
        <div style="display:flex; gap:20px; align-items:center;">
             <div>
                <button class="lang-btn" onclick="setLanguage('ar')">AR</button>
                <button class="lang-btn" onclick="setLanguage('en')">EN</button>
            </div>
            <!-- Back to Blog Link -->
            <a href="blog.html" class="nav-link">
                <i class="fas fa-arrow-right arrow-icon"></i> <span data-i18n="nav_blog">المدونة</span>
            </a>
        </div>
        <a href="index.html" class="nav-link" style="color:var(--primary);">WA Pro</a>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <!-- Loading State -->
        <div id="loading" style="text-align:center; color:#888; margin-top:50px;">
            <i class="fas fa-spinner fa-spin"></i> <span data-i18n="blogLoading">جاري تحميل المقال...</span>
        </div>
        
        <article id="articleContent" style="display:none;">
            <!-- Article Image -->
            <img id="pImage" class="post-img" src="" alt="Post Image">
            
            <!-- Title -->
            <h1 id="pTitle"></h1>
            
            <!-- Meta Data -->
            <div class="meta">
                <span id="pCat" style="color:var(--primary); font-weight:bold;"></span> | 
                <span id="pDate"></span>
            </div>
            
            <!-- Top AdSense -->
            <div class="ad-space">
                &lt;!-- Ad Banner Top --&gt;
            </div>

            <!-- Article Body -->
            <div id="pContent" class="content"></div>

            <!-- Bottom AdSense -->
             <div class="ad-space">
                &lt;!-- Ad Banner Bottom --&gt;
            </div>
        </article>
    </div>

    <!-- Translation Script -->
    <script src="translations.js"></script>
    <script>
        // --- Translation Logic (Same as Index) ---
        function setLanguage(lang) {
            localStorage.setItem('lang', lang);
            
            // 1. Change Direction & Font
            if (lang === 'en') {
                document.documentElement.lang = 'en';
                document.documentElement.dir = 'ltr';
                // Flip Arrow Icons for LTR
                document.querySelectorAll('.arrow-icon').forEach(el => {
                    el.classList.remove('fa-arrow-right');
                    el.classList.add('fa-arrow-left');
                });
            } else {
                document.documentElement.lang = 'ar';
                document.documentElement.dir = 'rtl';
                document.querySelectorAll('.arrow-icon').forEach(el => {
                    el.classList.remove('fa-arrow-left');
                    el.classList.add('fa-arrow-right');
                });
            }

            // 2. Update Buttons
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText.toLowerCase() === lang) btn.classList.add('active');
            });

            // 3. Update Text from Dictionary
            if(typeof dictionary !== 'undefined' && dictionary[lang]) {
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (dictionary[lang][key]) el.innerText = dictionary[lang][key];
                });
            }
        }

        // --- Init ---
        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('lang') || 'ar';
            setLanguage(savedLang);
            loadSinglePost();
        });

        // --- FETCH POST DATA (THE CORE LOGIC) ---
        async function loadSinglePost() {
            // 1. Get ID from URL (example.com/article-view.html?id=5)
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            
            // Redirect if no ID
            if(!id) { window.location.href = 'blog.html'; return; }

            try {
                // 2. Fetch from Backend
                const res = await fetch(`/api/blog/post/${id}`);
                
                if(!res.ok) throw new Error('Not found');
                const post = await res.json();

                // 3. Fill Data
                document.title = post.title; // Browser Tab Title
                document.getElementById('pTitle').textContent = post.title;
                document.getElementById('pCat').textContent = post.category || 'General';
                
                // Date Formatting
                const currentLang = localStorage.getItem('lang') || 'ar';
                const dateLocale = currentLang === 'en' ? 'en-US' : 'ar-MA';
                document.getElementById('pDate').textContent = new Date(post.created_at).toLocaleDateString(dateLocale);
                
                // Content (Use innerHTML for formatting)
                document.getElementById('pContent').innerHTML = post.content; 

                // Image Handling
                if(post.image) {
                    const img = document.getElementById('pImage');
                    // Server saves path like 'blog_images/image.jpg'
                    img.src = `/${post.image}`; 
                    img.style.display = 'block';
                }

                // Show Content
                document.getElementById('loading').style.display = 'none';
                document.getElementById('articleContent').style.display = 'block';

            } catch(e) {
                console.error(e);
                const errorMsg = localStorage.getItem('lang') === 'en' ? 'Article not found.' : 'المقال غير موجود أو تم حذفه.';
                document.getElementById('loading').innerHTML = `<span style='color:#ef4444; font-size:1.2em;'>${errorMsg}</span>`;
            }
        }
    </script>
</body>
</html>
