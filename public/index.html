<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; margin: 0; }
        .hero { padding: 50px 20px; text-align: center; background: linear-gradient(to bottom, #0f172a, #1e293b); }
        .blog-section { padding: 40px 20px; max-width: 1200px; margin: 0 auto; }
        .blog-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .blog-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; overflow: hidden; }
        .blog-img { width: 100%; height: 200px; object-fit: cover; }
        .blog-content { padding: 20px; }
        a { text-decoration: none; color: #00d26a; }
    </style>
</head>
<body>

    <div class="hero">
        <h1>مرحباً بك في WhatsApp Pro</h1>
        <p>أتمتة التسويق والذكاء الاصطناعي</p>
        <a href="blog.html" style="background:#00d26a; color:black; padding:10px 20px; border-radius:20px;">تصفح المدونة</a>
    </div>

    <!-- قسم المدونة في الصفحة الرئيسية -->
    <div class="blog-section">
        <h2 style="text-align: center;">أحدث المقالات</h2>
        <div class="blog-grid" id="blog-container">
            <p style="text-align: center; color: gray;">جاري التحميل...</p>
        </div>
    </div>

    <script>
        async function loadBlog() {
            try {
                const res = await fetch('/api/blog/posts');
                const posts = await res.json();
                const container = document.getElementById('blog-container');
                container.innerHTML = '';

                if (!posts || posts.length === 0) {
                    container.innerHTML = '<p style="text-align: center;">لا توجد مقالات.</p>';
                    return;
                }

                // عرض أحدث 3 مقالات فقط
                posts.slice(0, 3).forEach(post => {
                    const img = post.image ? `/${post.image}` : 'https://via.placeholder.com/400x200';
                    const html = `
                        <div class="blog-card">
                            <img src="${img}" class="blog-img">
                            <div class="blog-content">
                                <h3 style="margin-top:0">${post.title}</h3>
                                <p style="color:#aaa; font-size:0.9em">${post.summary}</p>
                                <a href="article-view.html?id=${post.id}">اقرأ المزيد &larr;</a>
                            </div>
                        </div>
                    `;
                    container.innerHTML += html;
                });
            } catch(e) { console.error(e); }
        }
        document.addEventListener('DOMContentLoaded', loadBlog);
    </script>
</body>
</html>
