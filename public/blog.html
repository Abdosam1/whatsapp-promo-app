<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Pro - Blog</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root { --bg-main: #0f172a; --bg-card: #1e293b; --primary: #00d26a; --text-main: #ffffff; --text-muted: #94a3b8; --border-color: #334155; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; overflow-x: hidden; transition: 0.3s; }
        html[lang="en"] body { font-family: 'Inter', sans-serif; }
        a { text-decoration: none; color: inherit; transition: 0.3s; }
        ul { list-style: none; padding: 0; margin: 0; }
        
        .header-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000; }
        .lang-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #94a3b8; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-left: 5px; }
        .lang-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .btn-nav-cta { background-color: var(--primary); color: #000; padding: 10px 25px; border-radius: 30px; font-weight: bold; font-size: 0.9em; display: inline-flex; align-items: center; gap: 8px; }
        
        .blog-header { text-align: center; padding: 60px 20px; background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); border-bottom: 1px solid var(--border-color); }
        .blog-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 2fr 1fr; gap: 40px; }
        
        .article-card { background: var(--bg-card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); display: flex; flex-direction: column; transition: 0.3s; }
        .article-card:hover { border-color: var(--primary); transform: translateY(-5px); }
        .article-img { width: 100%; height: 240px; background: #334155; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: #64748b; background-size: cover; background-position: center; }
        .article-content { padding: 25px; display: flex; flex-direction: column; flex-grow: 1; }
        html[dir="ltr"] .article-content { text-align: left; }
        
        .article-meta { color: var(--primary); font-size: 0.85em; font-weight: bold; margin-bottom: 10px; background: rgba(0, 210, 106, 0.1); padding: 5px 10px; border-radius: 4px; width: fit-content; }
        .article-title { font-size: 1.6em; margin: 0 0 15px; color: white; }
        .read-btn { color: var(--primary); font-weight: bold; margin-top: auto; display: inline-flex; align-items: center; gap: 5px; }

        .widget { background: var(--bg-card); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 30px; }
        .widget h3 { margin-top: 0; padding-bottom: 10px; border-bottom: 2px solid var(--primary); display: inline-block; color: white; }
        html[dir="ltr"] .widget h3 { border-bottom: none; border-left: 3px solid var(--primary); padding-left: 10px; padding-bottom: 0; }
        .cat-list li { margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; }
        .cat-list a:hover { color: var(--primary); }

        .site-footer { border-top: 1px solid var(--border-color); background: #0b1120; padding: 40px 0; color: var(--text-muted); text-align: center; margin-top: 50px; }
        
        @media (max-width: 900px) { .blog-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <nav class="header-nav">
        <div style="display:flex; align-items:center; gap:20px;">
            <div>
                <button class="lang-btn" onclick="changeLang('ar')">AR</button>
                <button class="lang-btn" onclick="changeLang('en')">EN</button>
            </div>
            <a href="index.html" style="color:#ccc; display:flex; gap:5px;">
                <i class="fas fa-home"></i> <span data-i18n="navHome">الرئيسية</span>
            </a>
        </div>
        <a href="/auth" class="btn-nav-cta">
            <i class="fas fa-rocket"></i> <span data-i18n="ctaGetStarted">ابدأ الآن</span>
        </a>
    </nav>

    <header class="blog-header">
        <h1 data-i18n="heroTitle">المدونة & أكاديمية التسويق</h1>
        <p data-i18n="heroSubtitle">كل ما تحتاج معرفته عن التسويق عبر واتساب، الأتمتة، وزيادة المبيعات.</p>
    </header>

    <div class="blog-container">
        
        <main class="articles-list" id="articles-list">
            <p style="text-align:center; color:#888;" data-i18n="loading">جاري تحميل المقالات...</p>
        </main>

        <aside>
            <div class="widget">
                <h3 data-i18n="searchPlaceholder">بحث</h3> <!-- Fixed Title -->
                <input type="text" data-i18n-placeholder="searchPlaceholder" placeholder="ابحث..." style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px;">
            </div>

            <div class="widget">
                <h3 data-i18n="categoriesTitle">التصنيفات</h3>
                <ul class="cat-list">
                    <li><a href="#"><span data-i18n="catDigital">التسويق الرقمي</span></a></li>
                    <li><a href="#"><span data-i18n="catWhatsApp">شروحات واتساب</span></a></li>
                    <li><a href="#"><span data-i18n="catAutomation">أتمتة وذكاء اصطناعي</span></a></li>
                    <li><a href="#"><span data-i18n="catEcommerce">التجارة الإلكترونية</span></a></li>
                </ul>
            </div>
        </aside>
    </div>

    <footer class="site-footer">
        <p>&copy; 2025 WhatsApp Pro. <span data-i18n="footerRights">جميع الحقوق محفوظة.</span></p>
    </footer>

    <!-- Import Translations -->
    <script src="translations.js"></script>

    <script>
        // 1. Change Language Function
        function changeLang(lang) {
            localStorage.setItem('lang', lang);
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

            // Update Text
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(translations[lang][key]) el.textContent = translations[lang][key];
            });

            // Update Placeholders
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if(translations[lang][key]) el.placeholder = translations[lang][key];
            });

            // Update Buttons Active State
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.textContent.toLowerCase() === lang) btn.classList.add('active');
            });

            // Refresh Dynamic Content (Articles) if needed
            loadBlogPosts(); 
        }

        // 2. Load Posts & Apply Translation
        async function loadBlogPosts() {
            try {
                const res = await fetch('/api/blog/posts');
                const posts = await res.json();
                const container = document.getElementById('articles-list');
                const lang = localStorage.getItem('lang') || 'ar';
                const readMoreText = translations[lang]['readMore'];

                container.innerHTML = '';

                if(posts.length === 0) {
                    container.innerHTML = '<p style="text-align:center">No articles.</p>'; return;
                }

                posts.forEach(post => {
                    const imgStyle = post.image ? `background-image:url('/blog_images/${post.image}');` : '';
                    const fallback = post.image ? '' : '<i class="fas fa-image"></i>';
                    const arrowIcon = lang === 'ar' ? 'fa-arrow-left' : 'fa-arrow-right';

                    const html = `
                        <article class="article-card">
                            <div class="article-img" style="${imgStyle}">${fallback}</div>
                            <div class="article-content">
                                <span class="article-meta">${post.category || 'General'}</span>
                                <h2 class="article-title">${post.title}</h2>
                                <p style="color:#94a3b8; flex-grow:1;">${post.excerpt}</p>
                                <a href="article-view.html?id=${post.id}" class="read-btn">
                                    ${readMoreText} <i class="fas ${arrowIcon}"></i>
                                </a>
                            </div>
                        </article>
                    `;
                    container.insertAdjacentHTML('beforeend', html);
                });
            } catch(e) { console.error(e); }
        }

        // 3. Init on Load
        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('lang') || 'ar';
            changeLang(savedLang);
        });
    </script>
</body>
</html>
