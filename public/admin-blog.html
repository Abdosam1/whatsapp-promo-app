<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة المدونة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #0f172a; color: white; font-family: 'Cairo', sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        input, textarea, select { width: 100%; padding: 12px; margin-bottom: 15px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 8px; box-sizing: border-box; }
        button { background: #00d26a; color: #000; padding: 12px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #00b359; }
        .post-item { background: #1e293b; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; border: 1px solid #334155; }
    </style>
</head>
<body>
    <div class="container">
        <h1>لوحة تحكم المدونة</h1>
        <div style="background: #162032; padding: 20px; border-radius: 12px; margin-bottom: 20px;">
            <form id="blogForm">
                <label>عنوان المقال:</label>
                <input type="text" id="title" required>
                
                <label>ملخص (يظهر في القائمة):</label>
                <textarea id="summary" rows="3" required></textarea>
                
                <label>المحتوى الكامل (HTML مسموح):</label>
                <textarea id="content" rows="10" required></textarea>

                <label>التصنيف:</label>
                <select id="category">
                    <option value="Digital Marketing">التسويق الرقمي</option>
                    <option value="Automation">أتمتة</option>
                    <option value="WhatsApp">واتساب</option>
                </select>

                <label>الصورة:</label>
                <input type="file" id="image" accept="image/*">

                <button type="submit" id="submitBtn">نشر المقال</button>
            </form>
        </div>
        <h2>المقالات السابقة</h2>
        <div id="postsList"></div>
    </div>

    <script>
        const token = localStorage.getItem('token'); 
        if(!token) alert("يجب تسجيل الدخول أولاً!");

        // إضافة مقال
        document.getElementById('blogForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "جاري النشر...";

            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('summary', document.getElementById('summary').value);
            formData.append('content', document.getElementById('content').value);
            formData.append('category', document.getElementById('category').value);
            if(document.getElementById('image').files[0]) {
                formData.append('image', document.getElementById('image').files[0]);
            }

            try {
                const res = await fetch('/api/blog/create', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                const data = await res.json();
                if(data.success) {
                    alert('تم النشر بنجاح!');
                    location.reload();
                } else {
                    alert('خطأ: ' + (data.message || data.error));
                }
            } catch(e) { console.error(e); alert('خطأ في الاتصال'); }
            btn.disabled = false;
            btn.innerText = "نشر المقال";
        });

        // عرض المقالات للحذف
        async function loadPosts() {
            const res = await fetch('/api/blog/posts');
            const posts = await res.json();
            const container = document.getElementById('postsList');
            container.innerHTML = '';
            posts.forEach(p => {
                container.innerHTML += `
                    <div class="post-item">
                        <span>${p.title}</span>
                        <button onclick="deletePost(${p.id})" style="width:auto; background:red; color:white;">حذف</button>
                    </div>`;
            });
        }

        async function deletePost(id) {
            if(!confirm('حذف نهائي؟')) return;
            await fetch(`/api/blog/delete/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            loadPosts();
        }
        loadPosts();
    </script>
</body>
</html>
